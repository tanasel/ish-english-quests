<!DOCTYPE html>
<html lang="en" data-theme="light" data-font="standard" data-contrast="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Build an ISH English quest pack with a copy-paste AI bridge, then preview, save, export, or share it." />
  <title>Build a Quest · Quest Forge</title>
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("ishQuest.prefs.v1");
        var p = raw ? JSON.parse(raw) : {};
        var theme = p.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.font = p.font === "dyslexic" ? "dyslexic" : "standard";
        document.documentElement.dataset.contrast = p.contrast ? "high" : "normal";
        document.documentElement.dataset.size = p.biggerText ? "big" : "normal";
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600..900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <script src="config.js?v=2"></script>
</head>

  <script src="builder.js?v=2"></script>
</body>
</html>
